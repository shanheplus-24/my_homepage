name: Confirm publication review

on:
  workflow_dispatch:
    inputs:
      review:
        description: Paste the confirmation code copied from the publication dashboard
        required: true
        type: string

permissions:
  contents: write
  actions: write

concurrency:
  group: publications-sync
  cancel-in-progress: false

jobs:
  confirm:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Confirm only the reviewed version
        env:
          PUBLICATION_REVIEW: ${{ inputs.review }}
        run: node scripts/publications/confirm.mjs
      - run: npm run publications:test
      - run: npm run validate
      - name: Save confirmation
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/publication-overrides
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Record owner review of publication update"
            git fetch origin main
            git rebase origin/main
            npm run publications:test
            npm run validate
            git push origin HEAD:main
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Deploy reviewed status
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref main
